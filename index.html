/* Layout: full-screen dreamy field (WebGL) with floating objects; glass UI floats over it; a "window" opens per object. Single committed look (sky), light only. */
:root{
  --sky-top:#6f8dff;
  --sky-mid:#c9b3ff;
  --sky-low:#ffd0e4;
  --ink:#231a4d;
  --ink-soft:#5a4e8c;
  --glass:rgba(255,250,255,.78);
  --glass-line:rgba(255,255,255,.95);
  --bubble:#ff5fb4;
  --lime:#c6ff6b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-low));color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bubble);outline-offset:3px}

/* ---------- top chrome ---------- */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;

  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{min-width:0}
.wordmark{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,34px);line-height:.95;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#e4e0ff 38%,#7d70de 49%,#ffffff 53%,#ffd2ec 100%);

.tagline{margin:8px 0 0;font-size:14px;font-weight:500;color:var(--ink);max-width:32ch;text-wrap:balance}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:0 6px 24px rgba(60,40,150,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill button:hover:not([aria-pressed="true"]){background:rgba(255,95,180,.16)}
.solo{padding:11px 16px}

/* ---------- bottom ---------- */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;
  padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 24px rgba(60,40,150,.16);transition:opacity .4s}
.hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bubble);margin-right:8px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.proto{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75;max-width:22ch}
body.panel-open .hint{opacity:0;pointer-events:none}

/* ---------- object labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid var(--glass-line);background:rgba(255,255,255,.8);
  padding:6px 11px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 4px 16px rgba(60,40,150,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,color .2s,opacity .3s;will-change:transform}
.tag:hover,.tag.hot{background:var(--bubble);color:#fff;border-color:var(--bubble)}
.tag.dim{opacity:.35}

/* ---------- window panel ---------- */
.win{position:fixed;z-index:6;display:flex;flex-direction:column;
  top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));

  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 30px 80px rgba(45,25,120,.35),inset 0 1px 0 #fff;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.win.open{transform:none}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.9);
  background:linear-gradient(100deg,#e6e1ff,#ffe0f1 45%,#ddf8ff 80%,#f1ffd9)}
.titlebar .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bubble) 55%,#b02a7a);flex:none}
.titlebar .fname{font-family:var(--mono);font-size:12px;letter-spacing:.05em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{border:1px solid rgba(35,26,77,.15);background:#fff;border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px}
.xbtn:hover{background:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:24px 24px 8px;overscroll-behavior:contain}
.kicker{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bubble)}
.pbody h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,32px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.intro{margin:12px 0 4px;font-size:16px;line-height:1.5;color:var(--ink);max-width:60ch}
.item{padding:22px 0;border-top:1px solid rgba(35,26,77,.12)}
.item:first-of-type{margin-top:18px}
.item h3{margin:0;font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:-.01em}
.meta{margin:4px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft)}
.item p.d{margin:10px 0 0;font-size:15px;line-height:1.55}
.item ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.item li{font-size:14.5px;line-height:1.45;padding-left:18px;position:relative}
.item li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--bubble),#8f7bff)}
.media{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;max-width:100%;
  background:linear-gradient(140deg,#ffd3ee,#d9d0ff 45%,#c9f6ff 75%,#eaffc9);border:1px solid #fff;display:flex;align-items:flex-end;padding:8px}
.tile.video{grid-column:span 3;aspect-ratio:16/9;background:linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)}
.tile span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 8px}
.tile.video::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-35%,-50%);border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(198,255,107,.55);border:1px solid rgba(35,26,77,.08)}

.list{position:fixed;inset:0;z-index:7;overflow-y:auto;background:rgba(236,226,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);

.list-inner{max-width:1080px;margin:0 auto}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.list-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{text-align:left;border:1px solid var(--glass-line);background:rgba(255,255,255,.75);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;

.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(60,40,150,.2)}
.card .kicker{margin:0}
.card h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft)}

@media (max-width:700px){

    width:auto;height:70%;transform:translateY(calc(100% + 30px))}
  .win.open{transform:none}
  .tagline{display:none}
  .hint{font-size:12.5px}
  .proto{display:none}
  .tag{font-size:10px;padding:5px 9px}
  .pbody{padding:20px 18px 8px}
}
@media (prefers-reduced-motion:reduce){
  .win,.tag,.card{transition:none}
  .hint i{animation:none}
}

  c.items.forEach((it,j)=>{

    if(it.b) h+=`<ul>${it.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

    if(it.tags) h+=`<div class="tags">${it.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;

  });

  $("#pbody").innerHTML=h;

function openSection(i){
  current=i; renderPanel(i); $("#pbody").scrollTop=0;

  labels.forEach((el,k)=>el.classList.toggle("dim",k!==i));
  if(location.hash!=="#"+SECTIONS[i].id) location.hash=SECTIONS[i].id;
}
function closePanel(){
  current=-1; const w=$("#win"); w.classList.remove("open"); w.setAttribute("aria-hidden","true"); document.body.classList.remove("panel-open");
  labels.forEach(el=>el.classList.remove("dim"));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
}
function fromHash(){ const id=location.hash.slice(1); const i=SECTIONS.findIndex(s=>s.id===id); if(i>=0){ if(i!==current) openSection(i);} else if(current>=0) closePanel(); }

  add(g,new THREE.CylinderGeometry(.08,.08,.08,24),candy("#ff5fb4"),[.36,.4,0]);add(g,rbox(.24,.13,.12,.03),matte("#ffffff"),[-.3,.4,0]);return g;},

  [-1,1].forEach(s=>{add(g,new THREE.CylinderGeometry(.21,.21,.18,32),candy("#ff8fd0"),[s*.52,-.12,0],[0,0,Math.PI/2]);
   add(g,new THREE.TorusGeometry(.17,.06,12,28),matte("#2b2356"),[s*.42,-.12,0],[0,Math.PI/2,0]);});return g;},
 gameboy(){const g=new THREE.Group();add(g,rbox(.78,1.25,.22,.07),candy("#dcd6ff"));add(g,rbox(.62,.5,.05,.02),candy("#3b3670"),[0,.26,.11]);
  const scr=canvasTex(128,112,(x,w,h)=>{x.fillStyle="#9fd86d";x.fillRect(0,0,w,h);x.fillStyle="#2f4a1c";x.font="bold 30px monospace";x.textAlign="center";x.fillText("ANA",w/2,58);x.font="bold 18px monospace";x.fillText("♥ ★ ♥",w/2,88);});
  add(g,new THREE.PlaneGeometry(.42,.36),new THREE.MeshBasicMaterial({map:scr,toneMapped:false}),[0,.26,.14]);
  add(g,rbox(.24,.08,.06,.02),matte("#2b2356"),[-.18,-.22,.12]);add(g,rbox(.08,.24,.06,.02),matte("#2b2356"),[-.18,-.22,.12]);
  add(g,new THREE.CylinderGeometry(.055,.055,.05,24),candy("#ff5fb4"),[.14,-.25,.12],[Math.PI/2,0,0]);add(g,new THREE.CylinderGeometry(.055,.055,.05,24),candy("#ff5fb4"),[.27,-.17,.12],[Math.PI/2,0,0]);
  add(g,rbox(.12,.035,.04,.012),matte("#8b84b8"),[-.07,-.45,.12],[0,0,-.5]);add(g,rbox(.12,.035,.04,.012),matte("#8b84b8"),[.08,-.45,.12],[0,0,-.5]);return g;},

/* ---------- build objects ---------- */
const pickables=[];
const objs=SECTIONS.map((s,i)=>{
  const root=new THREE.Group(), spin=new THREE.Group(), model=SHAPES[s.shape]();
  spin.add(model); root.add(spin); scene.add(root);
  model.traverse(o=>{ if(o.isMesh){ o.userData.si=i; pickables.push(o);} });
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; scene.add(sh);
  const o={root,spin,shadow:sh,target:new THREE.Vector3(),scale:1,hs:1,phase:i*.9};
  if(s.model && THREE.GLTFLoader){ new THREE.GLTFLoader().load(s.model,gl=>{
      const m=gl.scene, box=new THREE.Box3().setFromObject(m), size=box.getSize(new THREE.Vector3());
      m.scale.setScalar(1.15/Math.max(size.x,size.y,size.z)); box.setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
      spin.remove(model); spin.add(m);
      for(let k=pickables.length-1;k>=0;k--) if(pickables[k].userData.si===i) pickables.splice(k,1);
      m.traverse(x=>{ if(x.isMesh){ x.userData.si=i; pickables.push(x);} });
    },undefined,()=>{}); }
  return o;
});

/* ---------- layout: arc (landscape) or 2 columns (portrait) ---------- */
let portrait=false; const view={pos:new THREE.Vector3(),look:new THREE.Vector3(),fov:40};
function layout(){
  const w=innerWidth,h=innerHeight,asp=w/h; portrait=asp<.9;
  renderer.setSize(w,h,false); camera.aspect=asp;
  if(!portrait){
    objs.forEach((o,i)=>{const t=i/(objs.length-1);const x=(t-.5)*13.2, z=(i%2?-1.7:.9)-Math.sin(t*Math.PI)*1.2;o.target.set(x,0,z);o.scale=1;});
    const k=Math.max(1,1.55/asp); view.pos.set(0,3.4,12.2*k); view.look.set(0,.9,-.6); view.fov=40;
  } else {
    objs.forEach((o,i)=>{const col=i%2,row=Math.floor(i/2);o.target.set(col?1.3:-1.3,0,1.6-row*3.1+(col?-.6:0));o.scale=.85;});
    view.pos.set(0,6.6,9.6); view.look.set(0,.2,-3.4); view.fov=asp<.6?62:54;
  }
  objs.forEach(o=>o.target.y=H(o.target.x,o.target.z)+1.05);
  camera.updateProjectionMatrix();
}
addEventListener("resize",layout); layout();
objs.forEach(o=>o.root.position.copy(o.target));
const camPos=view.pos.clone(), camLook=view.look.clone(); camera.position.copy(camPos);

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null, parX=0, parY=0;
const canvasEl=$("#scene");
function pick(e){ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);const hit=ray.intersectObjects(pickables,false)[0];return hit?hit.object.userData.si:-1;}
canvasEl.addEventListener("pointermove",e=>{parX=e.clientX/innerWidth-.5;parY=e.clientY/innerHeight-.5;if(e.pointerType==="mouse"){hover=pick(e);canvasEl.style.cursor=hover>=0?"pointer":"default";}});
canvasEl.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY};});
canvasEl.addEventListener("pointerup",e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>8)return;
  const i=pick(e); if(i>=0) openSection(i); else if(current>=0) closePanel();});
canvasEl.addEventListener("pointerleave",()=>{hover=-1;});

/* ---------- loop ---------- */
const clock=new THREE.Clock(), v=new THREE.Vector3(), wantPos=new THREE.Vector3(), wantLook=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(camera.fov!==view.fov){camera.fov+= (view.fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();}
  objs.forEach((o,i)=>{
    const bob=reduce?0:Math.sin(t*1.3+o.phase)*.12;
    o.root.position.x+= (o.target.x-o.root.position.x)*Math.min(1,dt*3);
    o.root.position.z+= (o.target.z-o.root.position.z)*Math.min(1,dt*3);
    o.root.position.y+= (o.target.y+bob-o.root.position.y)*Math.min(1,dt*6);
    const want=o.scale*((hover===i||current===i)?1.16:1); o.hs+=(want-o.hs)*Math.min(1,dt*8); o.root.scale.setScalar(o.hs);
    if(!reduce) o.spin.rotation.y += dt*(current===i?.25:(hover===i?1.4:.45));
    o.spin.rotation.z = reduce?0:Math.sin(t*.9+o.phase)*.06;
    const gy=H(o.root.position.x,o.root.position.z)+.02; o.shadow.position.set(o.root.position.x,gy,o.root.position.z);
    const sc=o.hs*(1.05-bob*1.2); o.shadow.scale.set(sc,sc,1);
    /* label */
    v.copy(o.root.position); v.y+= .95*o.hs; v.project(camera);
    const el=labels[i]; if(v.z>1){el.style.visibility="hidden";} else {el.style.visibility="visible";
      el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;}
    el.classList.toggle("hot",hover===i||current===i);
  });
  /* camera: overview or focus on the open object */
  if(current>=0){const p=objs[current].root.position;
    if(!portrait){wantPos.set(p.x*.85,p.y+1.1,p.z+4.6);wantLook.set(p.x+1.35,p.y-.05,p.z);} else {wantPos.set(p.x*.5,p.y+2.2,p.z+4.4);wantLook.set(p.x*.6,p.y-1.15,p.z);}
  } else {wantPos.copy(view.pos);wantLook.copy(view.look); if(!reduce){wantPos.x+=parX*1.4;wantPos.y-=parY*.6;}}
  const k=reduce?1:Math.min(1,dt*2.4); camPos.lerp(wantPos,k); camLook.lerp(wantLook,k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if(!reduce){ sparkles.material.opacity=.65+.3*Math.sin(t*2.1); sparkles.rotation.y=Math.sin(t*.05)*.1;
    clouds.forEach((c,j)=>{c.position.x+=dt*(.35+j*.04); if(c.position.x>60) c.position.x=-60;}); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
renderUI(); fromHash(); frame();
}
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ana Georgina Velasco</title>
<meta name="description" content="Portfolio de Ana Georgina Velasco: comunicación cultural, festivales, medios, mediación y apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a velvet curtain to open, then a red lodge floating in the cosmos (WebGL) with objects you can throw; paper-cream windows open per object. Single committed dark look. */
:root{
  --void:#06030a;
  --paper:#f6efe2;
  --ink:#1d1216;
  --ink-soft:#6e5a60;
  --glass:rgba(246,239,226,.96);
  --glass-line:rgba(255,250,240,.9);
  --bubble:#b3122e;
  --lime:#e3b341;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bubble);outline-offset:3px}

/* ---------- top chrome ---------- */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{min-width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:0 6px 24px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill button:hover:not([aria-pressed="true"]){background:rgba(255,95,180,.16)}
.solo{padding:11px 16px}

/* ---------- festival pass (identity + contact) ---------- */
.badge{position:fixed;top:0;left:max(18px,env(safe-area-inset-left,0px));z-index:5;display:flex;flex-direction:column;align-items:center;width:236px}
.strap{width:16px;height:calc(22px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(180deg,#b3122e 0 6px,#6e0a18 6px 12px);box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.card-id{position:relative;width:100%;border:3px solid transparent;border-radius:20px;
  background:linear-gradient(#fbf6ec,#f1e7d3) padding-box,conic-gradient(from 120deg,#e3b341,#fff1c4,#a8791f,#f3d27a,#e3b341) border-box;
  box-shadow:0 18px 40px rgba(0,0,0,.3);transform-origin:50% -24px;animation:swing 6s ease-in-out infinite;overflow:hidden}
.card-id::before{content:"";position:absolute;top:8px;left:50%;width:34px;height:7px;margin-left:-17px;border-radius:99px;background:rgba(29,18,22,.18)}
@keyframes swing{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.pass{display:flex;justify-content:space-between;align-items:center;margin:22px 0 0;padding:6px 14px;background:linear-gradient(90deg,#6e0a18,var(--bubble));color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em}
.pass-r{display:flex;align-items:center;gap:8px}
.id-x{border:0;padding:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:15px;line-height:22px;cursor:pointer}
.id-x:hover{background:#fff;color:var(--bubble)}
.id-top{display:flex;gap:12px;align-items:center;padding:14px 14px 0}
.id-photo{flex:none;width:76px;height:92px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#eee;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.25)}
.id-photo img{width:100%;height:100%;object-fit:cover;display:block}
.id-name{margin:0;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.05;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.id-role{margin:6px 0 0;font-size:12.5px;line-height:1.3;color:var(--ink-soft);font-weight:500}
.id-more{padding:12px 14px 14px;display:grid;gap:10px}
.id-meta{display:flex;flex-wrap:wrap;gap:6px}
.id-meta span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:rgba(179,18,46,.08);color:var(--ink)}
.id-links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.id-links a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;border:1px solid rgba(29,18,22,.14)}
.id-links a.mail{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink)}
.id-links a:hover{background:var(--bubble);border-color:var(--bubble);color:#fff}
.copymail{border:0;background:none;padding:0;font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center;cursor:copy;word-break:break-all}
.copymail:hover{color:var(--bubble)}
.badge.closed{width:auto}
.badge.closed .id-more,.badge.closed .pass{display:none}
.badge.closed .card-id::before{display:none}
.badge.closed .id-top{padding:8px 12px 8px 8px}
.badge.closed .id-photo{width:44px;height:44px;border-radius:50%}
.badge.closed .id-name{font-size:13px}
.badge.closed .id-role{display:none}
.badge.closed .id-name{max-width:104px}
.solo .ico{display:none}

/* ---------- media inside windows ---------- */
.players{display:grid;gap:10px;margin-top:14px}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:0;padding:0;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.player::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(179,18,46,.92);box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
.player::after{content:"";position:absolute;left:50%;top:50%;margin:-12px 0 0 -6px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.player:hover::before{transform:scale(1.1)}
.player .pl{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:4px 10px}
.player.on::before,.player.on::after{display:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.igrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px;padding-bottom:8px;overscroll-behavior-x:contain}
.igrow iframe{flex:none;width:326px;max-width:88%;height:600px;border:0;border-radius:14px;background:#fff;scroll-snap-align:start;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.swipe{margin:8px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.igcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.igcard{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,#e3b341,#b3122e 45%,#3a0610);box-shadow:0 6px 16px rgba(0,0,0,.15);transition:transform .2s}
.igcard::before{content:"";position:absolute;top:10px;left:10px;width:18px;height:18px;border:2.5px solid #fff;border-radius:6px}
.igcard::after{content:"";position:absolute;top:16px;left:16px;width:6px;height:6px;border:2.5px solid #fff;border-radius:50%}
.igcard:hover{transform:translateY(-2px)}
.igcard b{font-size:13px}
.igcard small{font-family:var(--mono);font-size:10px;opacity:.9}
.ctas{display:grid;gap:8px;margin-top:14px}
.cta{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:16px;background:var(--ink);color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(29,18,22,.22);transition:background .2s,transform .2s}
.cta:hover{background:var(--bubble);transform:translateY(-1px)}
.cta-t{display:grid;min-width:0}
.cta-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.cta-v{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:16px}

/* ---------- entrance curtain ---------- */
.gate{position:fixed;inset:0;z-index:30;--open:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gate.opening{pointer-events:none}
.curtain{position:absolute;top:0;bottom:0;width:51%;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.6)),
    repeating-linear-gradient(90deg,#3e040c 0,#7d0d1c 22px,#c41d30 40px,#a01526 56px,#5a0812 74px,#3e040c 82px);
  box-shadow:0 0 60px rgba(0,0,0,.7)}
.curtain.l{left:0;transform:translateX(calc(var(--open) * -102%))}
.curtain.r{right:0;transform:translateX(calc(var(--open) * 102%))}
.gate:not(.dragging) .curtain{transition:transform 1.15s cubic-bezier(.7,0,.2,1)}
.valance{position:absolute;left:0;right:0;top:0;height:clamp(54px,9vh,90px);z-index:1;opacity:calc(1 - var(--open) * 1.6);
  background:repeating-linear-gradient(90deg,#4a0610 0,#9c1424 26px,#4a0610 52px);border-bottom:3px solid var(--lime);box-shadow:0 8px 30px rgba(0,0,0,.6)}
.gate-c{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:calc(1 - var(--open) * 2.4);pointer-events:none}
.gate-k{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--lime)}
.gate-name{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,84px);line-height:.95;color:var(--paper);text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.gate-hint{margin:6px 0 0;font-size:15px;color:var(--paper);opacity:.85;display:flex;align-items:center;gap:10px}
.gate-hint b{display:inline-block;color:var(--lime);animation:nudge 1.6s ease-in-out infinite}
.gate-hint b:last-child{animation-direction:reverse}
@keyframes nudge{50%{transform:translateX(-6px)}}
.gate-btn{pointer-events:auto;margin-top:4px;padding:12px 26px;border-radius:999px;border:1px solid var(--lime);background:rgba(0,0,0,.35);color:var(--paper);
  font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.gate-btn:hover{background:var(--lime);color:var(--ink)}
@media (prefers-reduced-motion:reduce){ .gate:not(.dragging) .curtain{transition:none} .gate-hint b{animation:none} }

/* ---------- bottom ---------- */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;
  padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.16);transition:opacity .4s}
.hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bubble);margin-right:8px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.proto{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75;max-width:22ch}
body.panel-open .hint{opacity:0;pointer-events:none}

/* ---------- object labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid var(--glass-line);background:rgba(246,239,226,.92);color:var(--ink);
  padding:6px 11px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,color .2s,opacity .3s;will-change:transform}
.tag:hover,.tag.hot{background:var(--bubble);color:#fff;border-color:var(--bubble)}
.tag.dim{opacity:.35}

/* ---------- window panel ---------- */
.win{position:fixed;z-index:6;display:flex;flex-direction:column;
  top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:min(470px,calc(100vw - 32px));border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 #fff;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.win.open{transform:none}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.9);
  background:linear-gradient(90deg,#5e0814,#b3122e)}
.titlebar .fname{color:var(--paper)}
.titlebar .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d8 0 18%,var(--lime) 55%,#8a6514);flex:none}
.titlebar .fname{font-family:var(--mono);font-size:12px;letter-spacing:.05em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{border:1px solid rgba(29,18,22,.15);background:#fff;border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px}
.xbtn:hover{background:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:24px 24px 8px;overscroll-behavior:contain}
.kicker{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bubble)}
.pbody h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,32px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.intro{margin:12px 0 4px;font-size:16px;line-height:1.5;color:var(--ink);max-width:60ch}
.item{padding:22px 0;border-top:1px solid rgba(29,18,22,.12)}
.item:first-of-type{margin-top:18px}
.item h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:-.01em}
.meta{margin:4px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft)}
.item p.d{margin:10px 0 0;font-size:15px;line-height:1.55}
.item p.d + p.d{margin-top:8px}
.intro + .intro{margin-top:10px}
.pbody strong{font-weight:700;color:var(--ink);background:linear-gradient(transparent 62%,rgba(227,179,65,.5) 62%);padding:0 1px}
.item ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.item li{font-size:14.5px;line-height:1.45;padding-left:18px;position:relative}
.item li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--bubble),var(--lime))}
.media{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;max-width:100%;
  background:linear-gradient(140deg,#ffd3ee,#d9d0ff 45%,#c9f6ff 75%,#eaffc9);border:1px solid #fff;display:flex;align-items:flex-end;padding:8px}
.tile.video{grid-column:span 3;aspect-ratio:16/9;background:linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)}
.tile span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 8px}
.tile.img{padding:0;cursor:zoom-in}
.tile.img img{width:100%;height:100%;object-fit:cover;display:block}
.tile.yt{aspect-ratio:16/9;cursor:pointer;background-size:cover;background-position:center;text-decoration:none;color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid rgba(29,18,22,.15);color:var(--ink);text-decoration:none}
.chip.ig{background:linear-gradient(135deg,#f6efe2,#ecd9b4)}
.chip:hover{background:var(--ink);color:#fff}
.lb{position:fixed;inset:0;z-index:9;background:rgba(20,12,50,.85);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb{flex-direction:column;gap:14px}
.lb-stage{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:calc(100% - 50px);min-height:0}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb iframe{border:0;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:100%}
.lb iframe.yt{width:min(960px,92vw);aspect-ratio:16/9;background:#000}
.lb iframe.ig{width:min(420px,92vw);height:min(760px,78vh)}
.lb-out{font-family:var(--mono);font-size:12px;color:#fff;text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5)}
.lb-out:hover{background:#fff;color:var(--ink)}
button.chip{cursor:pointer;font-family:var(--mono)}
.lb .xbtn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.tile.video::after,.tile.yt::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-35%,-50%);border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(179,18,46,.08);border:1px solid rgba(29,18,22,.08)}
.hero-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 62%;border-radius:16px;margin:0 0 20px;max-width:100%}
.contact{margin:18px 0 8px;padding:16px;border-radius:16px;background:var(--ink);color:#fff}
.contact p{margin:0}
.contact .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.contact .v{margin-top:6px;font-size:16px;font-weight:600;user-select:all;word-break:break-all}
.pnav{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5)}
.pnav button{border:1px solid rgba(29,18,22,.14);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnav button:hover{background:var(--bubble);color:#fff;border-color:var(--bubble)}

/* ---------- list view ---------- */
.list{position:fixed;inset:0;z-index:7;overflow-y:auto;background:rgba(8,4,6,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.list-inner{max-width:1080px;margin:0 auto}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.list-head h2{color:var(--paper);margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

  {t:"Double exposure",m:"Photo exhibition · Toulouse",d:"A series of superimposed, double-exposure photographs where heritage meets modernity in the **heart of Toulouse**.\n\nSculptures on old buildings converse with contemporary shop windows and the silhouettes of passers-by: the timelessness of stone against the fleeting everyday life of the city.\n\nThe compositions question the links between past and present, stillness and movement, offering a fragmented, poetic view of human paths through the city."},

  {t:"Double exposition",m:"Exposition photo · Toulouse",d:"Cette série de photographies superposées en double exposition propose une rencontre entre le patrimoine et la modernité au **cœur de Toulouse**.\n\nLes sculptures des bâtiments anciens dialoguent avec les vitrines contemporaines et les silhouettes des passant·es, révélant un croisement entre l'intemporalité de la pierre et l'éphémère du quotidien urbain.\n\nCes compositions questionnent les liens entre passé et présent, immobilité et mouvement, pour offrir une vision fragmentée et poétique des trajectoires humaines dans la ville."},

/* =========================================================
   3) LANGUAGE + UI
   ========================================================= */
let lang = (()=>{ try{ const s=localStorage.getItem("ana-lang"); if(s && UI[s]) return s; }catch(e){}
  const n=(navigator.language||"es").slice(0,2); return UI[n]?n:"es"; })();
let current = -1;
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const paras = (t,cls)=>String(t).split(/\n\n/).map(p=>`<p class="${cls}">${fmt(p).replace(/\n/g,"<br>")}</p>`).join("");
const plain = t=>String(t).replace(/\*\*/g,"").replace(/\n+/g," ");

function renderUI(){
  const u=UI[lang]; document.documentElement.lang=lang;
  $("#gateHint").textContent=u.gateHint; $("#gateBtn").textContent=u.gateBtn; $("#idRole").textContent=u.role; $("#idPlace").textContent=u.place; $("#mailBtn").textContent=u.mail; $("#copyMail").title=u.copied; $("#hint span").textContent=u.hint;
  $("#listLbl").textContent=u.list; $("#listBtn").setAttribute("aria-label",u.list); $("#fieldBtn").textContent=u.field; $("#listTitle").textContent=u.listTitle; $("#closeBtn").textContent=u.close+" ×";
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  labels.forEach((el,i)=>{ el.textContent=C[lang][SECTIONS[i].id].t; });
  $("#grid").innerHTML=SECTIONS.map((s,i)=>{const c=C[lang][s.id];return `<button class="card" data-i="${i}"><p class="kicker">${esc(c.k)}</p><h3>${esc(c.t)}</h3><p>${esc(plain(c.i))}</p></button>`}).join("");
  if(current>=0) renderPanel(current);
}
function renderPanel(i){
  const s=SECTIONS[i], c=C[lang][s.id], u=UI[lang];
  $("#fname").textContent=s.id+".exe";
  let h=(s.id==="sobre"?`<img class="hero-photo" src="media/fbal25-playa.jpg" alt="Ana Georgina Velasco">`:"")+`<p class="kicker">${esc(c.k)}</p><h2 id="pTitle">${esc(c.t)}</h2>${paras(c.i,"intro")}`;
  c.items.forEach((it,j)=>{
    const media=(s.media[j]||[]);
    h+=`<article class="item"><h3>${esc(it.t)}</h3>${it.m?`<p class="meta">${esc(it.m)}</p>`:""}${paras(it.d,"d")}`;
    if(it.b) h+=`<ul>${it.b.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
    const isPost=x=>/instagram\.com\/(p|reel)\//.test(x||"");
    const imgs=media.filter(m=>m.img), yts=media.filter(m=>m.yt), igs=media.filter(m=>isPost(m.ig)), links=media.filter(m=>m.link||(m.ig&&!isPost(m.ig)));
    const thumb=id=>`background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg),linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)`;
    if(imgs.length) h+=`<div class="media">${imgs.map(m=>`<button class="tile img" data-full="${m.img}"><img src="${m.img}" alt="${esc(it.t)}" loading="lazy"></button>`).join("")}</div>`;
    if(yts.length) h+=`<div class="players">${yts.map(m=>EMBED
      ?`<button class="player" data-yt="${m.yt}" style="${thumb(m.yt)}" aria-label="${u.play}: YouTube"></button>`
      :`<a class="player" href="https://youtu.be/${m.yt}" target="_blank" rel="noopener" style="${thumb(m.yt)}"><span class="pl">${u.watchOn} YouTube ↗</span></a>`).join("")}</div>`;
    if(igs.length) h+= EMBED
      ? `<div class="igrow">${igs.map(m=>`<iframe src="${m.ig.split("?")[0].replace(/\/?$/,"/")}embed/" loading="lazy" title="Instagram" allow="autoplay; encrypted-media" scrolling="no"></iframe>`).join("")}</div>${igs.length>1?`<p class="swipe">${u.swipe}</p>`:""}`
      : `<div class="igcards">${igs.map((m,k)=>`<a class="igcard" href="${m.ig}" target="_blank" rel="noopener"><b>${esc(m.label||(u.post+" "+(k+1)))}</b><small>${u.watchOn} Instagram ↗</small></a>`).join("")}</div>`;
    if(links.length) h+=`<div class="ctas">${links.map(m=>`<a class="cta" href="${m.link||m.ig}" target="_blank" rel="noopener"><span class="cta-t"><span class="cta-k">${m.ig?"Instagram":u.openApp}</span><span class="cta-v">${esc(m.label)}</span></span><span class="arr">↗</span></a>`).join("")}</div>`;
    if(it.tags) h+=`<div class="tags">${it.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
    h+=`</article>`;
  });
  $("#pbody").innerHTML=h;

  const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.7),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,opacity:.6}));
  sh.rotation.x=-Math.PI/2; scene.add(sh);
  const o={root,spin,shadow:sh,home:new THREE.Vector3(),vel:new THREE.Vector3(),av:new THREE.Vector3(),state:"home",rest:0,scale:1,hs:1,r:.62,phase:i*.9};
  if(s.model && THREE.GLTFLoader){ new THREE.GLTFLoader().load(s.model,gl=>{
      const m=gl.scene, box=new THREE.Box3().setFromObject(m), size=box.getSize(new THREE.Vector3());
      m.scale.setScalar(1.15/Math.max(size.x,size.y,size.z)); box.setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
      spin.remove(model); spin.add(m);
      for(let k=pickables.length-1;k>=0;k--) if(pickables[k].userData.si===i) pickables.splice(k,1);
      m.traverse(x=>{ if(x.isMesh){ x.userData.si=i; pickables.push(x);} });
    },undefined,()=>{}); }
  return o;
});

/* ---------- pointer: tap to open, drag to throw (registered before the orbit controls so it can claim the gesture) ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), dragPlane=new THREE.Plane(), hitP=new THREE.Vector3(), camDir=new THREE.Vector3(), tmp=new THREE.Vector3();
let drag=null, downPt=null, entered=false;
function setRay(e){ const r=canvasEl.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); }
function pick(e){ setRay(e); const h=ray.intersectObjects(pickables,false)[0]; return h?h.object.userData.si:-1; }
function keepInside(p,r){ const d=Math.hypot(p.x,p.z), lim=FLOOR_R-.7-r; if(d>lim){ p.x*=lim/d; p.z*=lim/d; } }
canvasEl.addEventListener("pointerdown",e=>{
  if(!entered) return;
  downPt={x:e.clientX,y:e.clientY};
  if(drag) return;
  const i=pick(e); if(i<0) return;
  const o=objs[i]; camera.getWorldDirection(camDir); dragPlane.setFromNormalAndCoplanarPoint(camDir,o.root.position);
  if(!ray.ray.intersectPlane(dragPlane,hitP)) return;
  drag={i,id:e.pointerId,off:o.root.position.clone().sub(hitP),moved:false,lt:performance.now()};
  controls.enabled=false; try{canvasEl.setPointerCapture(e.pointerId);}catch(_){}
  canvasEl.style.cursor="grabbing";
});
canvasEl.addEventListener("pointermove",e=>{
  if(drag && e.pointerId===drag.id){
    const o=objs[drag.i];
    if(!drag.moved && Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y)>6){ drag.moved=true; o.state="held"; o.rest=0; }
    if(drag.moved){ setRay(e); if(ray.ray.intersectPlane(dragPlane,hitP)){
      const now=performance.now(), dts=Math.max(8,now-drag.lt)/1000; drag.lt=now;
      tmp.copy(hitP).add(drag.off); tmp.y=Math.min(8,Math.max(tmp.y,o.r+.05)); keepInside(tmp,o.r);
      const v=tmp.clone().sub(o.root.position).divideScalar(dts); o.vel.lerp(v,.55); o.root.position.copy(tmp); } }
    return; }
  if(e.pointerType==="mouse" && entered && !e.buttons){ hover=pick(e); canvasEl.style.cursor=hover>=0?"grab":"default"; }
});
function endPointer(e){
  if(drag && e.pointerId===drag.id){ const o=objs[drag.i];
    if(!drag.moved && e.type==="pointerup") openSection(drag.i);
    else if(drag.moved){ o.state="free"; o.rest=0; if(o.vel.length()>16) o.vel.setLength(16);
      o.av.set(o.vel.z*1.3,(Math.random()-.5)*5,-o.vel.x*1.3); }
    drag=null; controls.enabled=true; canvasEl.style.cursor="default"; downPt=null; return; }
  if(downPt && e.type==="pointerup" && Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y)<6 && current>=0) closePanel();
  downPt=null;
}
canvasEl.addEventListener("pointerup",endPointer); canvasEl.addEventListener("pointercancel",endPointer);
canvasEl.addEventListener("pointerleave",()=>{ if(!drag) hover=-1; });

/* ---------- orbit camera (mouse drag / one finger to look around, wheel / pinch to zoom) ---------- */
const controls=new THREE.OrbitControls(camera,canvasEl);
Object.assign(controls,{enableDamping:true,dampingFactor:.07,enablePan:false,rotateSpeed:.55,zoomSpeed:.8,minDistance:4,maxDistance:24,
  minPolarAngle:.35,maxPolarAngle:1.47,minAzimuthAngle:-1.15,maxAzimuthAngle:1.15});
controls.enabled=false;

/* ---------- layout: arc (landscape) or 3-column grid (portrait) ---------- */
let portrait=null; const view={pos:new THREE.Vector3(),target:new THREE.Vector3(),fov:45};
function layout(){
  const w=innerWidth,h=innerHeight,asp=w/h, was=portrait; portrait=asp<.9;
  renderer.setSize(w,h,false); camera.aspect=asp;
  if(!portrait){
    objs.forEach((o,i)=>{const t=i/(objs.length-1); o.home.set((t-.5)*11.5,1.35,(i%2?-1.9:.6)-Math.sin(t*Math.PI)*1.1); o.scale=1;});
    const k=Math.max(1,1.5/asp); view.pos.set(0,3.6,12.5*k); view.target.set(0,1.1,-.6); view.fov=45;
  } else {
    objs.forEach((o,i)=>{const col=i%3,row=Math.floor(i/3); o.home.set((col-1)*1.8,1.25,1.4-row*2.9+(col===1?-.8:0)); o.scale=.78;});
    view.pos.set(0,6.2,12.8); view.target.set(0,.8,-1.6); view.fov=asp<.6?60:52;
  }
  objs.forEach(o=>{o.r=.62*o.scale;});
  camera.fov=view.fov; camera.updateProjectionMatrix();
  if(was!==null && was!==portrait && entered && current<0) flyTo(view.pos,view.target,.8);
}

/* ---------- camera flights ---------- */
let fly=null; const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(p,t,dur=1.1){
  if(reduce||dur<=0){ camera.position.copy(p); controls.target.copy(t); controls.update(); fly=null; return; }
  fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),k:0,dur};
}
addEventListener("resize",layout); layout();
objs.forEach(o=>o.root.position.copy(o.home));
camera.position.set(view.pos.x,view.pos.y+7,view.pos.z+16); controls.target.copy(view.target).add(new THREE.Vector3(0,3,0)); controls.update();
onEnter=()=>{ if(entered) return; entered=true; controls.enabled=true; flyTo(view.pos,view.target,2.6); };

/* ---------- loop ---------- */
const clock=new THREE.Clock(), v=new THREE.Vector3(), dv=new THREE.Vector3(), G=-14;
let lastCur=-2, offX=0, offY=0;
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const active=s=>s==="free"||s==="held";
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  /* focus the camera when a section opens or closes */
  if(entered && current!==lastCur){ lastCur=current;
    if(current>=0){ const o=objs[current], h=o.home; if(o.state!=="home") o.state="return";
      flyTo(new THREE.Vector3(h.x*.8,h.y+(portrait?2.4:1.3),h.z+(portrait?5.6:4.8)),new THREE.Vector3(h.x,h.y-.1,h.z),1.1);
    } else flyTo(view.pos,view.target,1.1); }
  if(fly){ fly.k+=dt/fly.dur; const e=ease(Math.min(1,fly.k)); camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.k>=1) fly=null; }
  controls.update();

  /* keep the open object clear of the window (side panel on desktop, bottom sheet on phones) */
  const open=current>=0, wide=innerWidth>700;
  const wantX=open&&wide?Math.min(470,innerWidth-32)/2:0, wantY=open&&!wide?innerHeight*.33:0, kk=reduce?1:Math.min(1,dt*4);
  offX+=(wantX-offX)*kk; offY+=(wantY-offY)*kk;
  if(Math.abs(offX)>.5||Math.abs(offY)>.5) camera.setViewOffset(innerWidth,innerHeight,offX,offY,innerWidth,innerHeight);
  else if(camera.view&&camera.view.enabled) camera.clearViewOffset();

  /* objects: float at home, follow the hand, fall with gravity, then drift back */
  objs.forEach((o,i)=>{
    const P=o.root.position, S=o.spin.rotation;
    if(o.state==="home"){
      const bob=reduce?0:Math.sin(t*1.3+o.phase)*.14, k=Math.min(1,dt*3);
      P.x+=(o.home.x-P.x)*k; P.z+=(o.home.z-P.z)*k; P.y+=(o.home.y+bob-P.y)*Math.min(1,dt*5);
      if(!reduce) S.y+=dt*(current===i?.25:(hover===i?1.4:.45));
      S.x+=(0-S.x)*k; S.z=reduce?0:S.z+((Math.sin(t*.9+o.phase)*.06)-S.z)*k;
    } else if(o.state==="held"){
      o.vel.multiplyScalar(Math.pow(.02,dt)); S.y+=dt*2;
    } else if(o.state==="free"){
      o.vel.y+=G*dt; P.addScaledVector(o.vel,dt);
      if(P.y<o.r){ P.y=o.r; if(o.vel.y<0) o.vel.y=-o.vel.y*.5; if(o.vel.y<.7) o.vel.y=0;
        const f=Math.pow(.25,dt); o.vel.x*=f; o.vel.z*=f; o.av.multiplyScalar(Math.pow(.2,dt)); }
      if(P.y>9){ P.y=9; o.vel.y=-Math.abs(o.vel.y)*.5; }
      const d=Math.hypot(P.x,P.z), lim=FLOOR_R-.7-o.r;
      if(d>lim){ const nx=P.x/d,nz=P.z/d; P.x=nx*lim; P.z=nz*lim; const vn=o.vel.x*nx+o.vel.z*nz; if(vn>0){ o.vel.x-=1.6*vn*nx; o.vel.z-=1.6*vn*nz; } }
      S.x+=o.av.x*dt; S.y+=o.av.y*dt; S.z+=o.av.z*dt;
      const still=P.y<=o.r+.01 && o.vel.lengthSq()<.05; o.rest=still?o.rest+dt:0;
      if(o.rest>2.2){ o.state="return"; S.x=wrapA(S.x); S.z=wrapA(S.z); }
    } else if(o.state==="return"){
      const k=Math.min(1,dt*1.8); P.lerp(o.home,k); S.x+=(0-S.x)*k; S.z+=(0-S.z)*k; S.y+=dt*.45;
      if(P.distanceTo(o.home)<.05) o.state="home";
    }
  });
  /* bumps between objects: a thrown object knocks the others off their spot */
  for(let a=0;a<objs.length;a++) for(let b=a+1;b<objs.length;b++){
    const A=objs[a],B=objs[b]; if(!active(A.state)&&!active(B.state)) continue;
    dv.subVectors(B.root.position,A.root.position); const d=dv.length(), m=A.r+B.r; if(d>=m||d<1e-4) continue;
    dv.divideScalar(d); const ov=m-d, wa=A.state==="held"?0:(B.state==="held"?1:.5);
    A.root.position.addScaledVector(dv,-ov*wa); B.root.position.addScaledVector(dv,ov*(1-wa));
    [A,B].forEach(X=>{ if(X.state==="home"||X.state==="return"){ X.state="free"; X.rest=0; X.spin.rotation.x=wrapA(X.spin.rotation.x); } });
    const rv=(B.vel.x-A.vel.x)*dv.x+(B.vel.y-A.vel.y)*dv.y+(B.vel.z-A.vel.z)*dv.z;
    if(rv<0){ const j=-1.7*rv; if(A.state!=="held") A.vel.addScaledVector(dv,-j*(B.state==="held"?1:.5)); if(B.state!=="held") B.vel.addScaledVector(dv,j*(A.state==="held"?1:.5)); }
  }
  objs.forEach((o,i)=>{
    const P=o.root.position;
    const want=o.scale*((hover===i||current===i)&&o.state==="home"?1.14:1); o.hs+=(want-o.hs)*Math.min(1,dt*8); o.root.scale.setScalar(o.hs);
    const hgt=Math.max(0,P.y-o.r); o.shadow.position.set(P.x,.012,P.z); const sc=o.hs*(1.25-Math.min(1,hgt/5)*.5); o.shadow.scale.set(sc,sc,1);
    o.shadow.material.opacity=.65-Math.min(1,hgt/5)*.4;
    v.copy(P); v.y+=.95*o.hs; v.project(camera);
    const el=labels[i], show=entered&&v.z<1&&o.state==="home";
    el.style.visibility=show?"visible":"hidden";
    if(show) el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
    el.classList.toggle("hot",hover===i||current===i);
  });

  if(!reduce){ swayCurtains(t); stars.material.opacity=.8+.15*Math.sin(t*1.7); stars.rotation.y=t*.006; nebulae.rotation.y=t*.004; dust.rotation.y=t*.03; dust.position.y=Math.sin(t*.3)*.15; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
renderUI(); frame();
if(gateDone){ onEnter(); fromHash(); }
}
</script>

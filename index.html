<meta charset="utf-8">

<title>Ana Georgina Velasco</title>
<meta name="description" content="Portfolio de Ana Georgina Velasco: comunicación cultural, festivales, medios, mediación y apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen dreamy field (WebGL) with floating objects; glass UI floats over it; a "window" opens per object. Single committed look (sky), light only. */
:root{
  --sky-top:#6f8dff;
  --sky-mid:#c9b3ff;
  --sky-low:#ffd0e4;
  --ink:#231a4d;
  --ink-soft:#5a4e8c;
  --glass:rgba(255,250,255,.78);
  --glass-line:rgba(255,255,255,.95);
  --bubble:#ff5fb4;
  --lime:#c6ff6b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-low));color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bubble);outline-offset:3px}

/* ---------- top chrome ---------- */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{min-width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:0 6px 24px rgba(60,40,150,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill button:hover:not([aria-pressed="true"]){background:rgba(255,95,180,.16)}
.solo{padding:11px 16px}

/* ---------- festival pass (identity + contact) ---------- */
.badge{position:fixed;top:0;left:max(18px,env(safe-area-inset-left,0px));z-index:5;display:flex;flex-direction:column;align-items:center;width:236px}
.strap{width:16px;height:calc(22px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(180deg,#ff3d6e 0 6px,#ff5f8d 6px 12px);box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.card-id{position:relative;width:100%;border:3px solid transparent;border-radius:20px;
  background:linear-gradient(#fffbfe,#fff6fc) padding-box,conic-gradient(from 120deg,#ff8fd0,#ffd84d,#c6ff6b,#7ef0ff,#a891ff,#ff8fd0) border-box;
  box-shadow:0 18px 40px rgba(45,25,120,.3);transform-origin:50% -24px;animation:swing 6s ease-in-out infinite;overflow:hidden}
.card-id::before{content:"";position:absolute;top:8px;left:50%;width:34px;height:7px;margin-left:-17px;border-radius:99px;background:rgba(35,26,77,.18)}
@keyframes swing{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.pass{display:flex;justify-content:space-between;align-items:center;margin:22px 0 0;padding:6px 14px;background:linear-gradient(90deg,var(--bubble),#8f7bff);color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em}
.id-top{display:flex;gap:12px;align-items:center;padding:14px 14px 0}
.id-photo{flex:none;width:76px;height:92px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#eee;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(45,25,120,.25)}
.id-photo img{width:100%;height:100%;object-fit:cover;display:block}
.id-name{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.id-role{margin:6px 0 0;font-size:12.5px;line-height:1.3;color:var(--ink-soft);font-weight:500}
.id-more{padding:12px 14px 14px;display:grid;gap:10px}
.id-meta{display:flex;flex-wrap:wrap;gap:6px}
.id-meta span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:rgba(143,123,255,.13);color:var(--ink)}
.id-links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.id-links a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;border:1px solid rgba(35,26,77,.14)}
.id-links a.mail{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink)}
.id-links a:hover{background:var(--bubble);border-color:var(--bubble);color:#fff}
.copymail{border:0;background:none;padding:0;font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center;cursor:copy;word-break:break-all}
.copymail:hover{color:var(--bubble)}
.badge.closed{width:auto}
.badge.closed .id-more,.badge.closed .pass{display:none}
.badge.closed .card-id::before{display:none}
.badge.closed .id-top{padding:8px 12px 8px 8px}
.badge.closed .id-photo{width:44px;height:44px;border-radius:50%}
.badge.closed .id-name{font-size:13px}
.badge.closed .id-role{display:none}
.badge.closed .id-name{max-width:104px}
.solo .ico{display:none}

/* ---------- media inside windows ---------- */
.players{display:grid;gap:10px;margin-top:14px}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:0;padding:0;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(45,25,120,.18)}
.player::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,95,180,.92);box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
.player::after{content:"";position:absolute;left:50%;top:50%;margin:-12px 0 0 -6px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.player:hover::before{transform:scale(1.1)}
.player .pl{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:4px 10px}
.player.on::before,.player.on::after{display:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.igrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px;padding-bottom:8px;overscroll-behavior-x:contain}
.igrow iframe{flex:none;width:326px;max-width:88%;height:600px;border:0;border-radius:14px;background:#fff;scroll-snap-align:start;box-shadow:0 8px 22px rgba(45,25,120,.15)}
.swipe{margin:8px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.igcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.igcard{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,#ffb86b,#ff5f8d 40%,#b44bd8 75%,#6a6cf0);box-shadow:0 6px 16px rgba(45,25,120,.15);transition:transform .2s}
.igcard::before{content:"";position:absolute;top:10px;left:10px;width:18px;height:18px;border:2.5px solid #fff;border-radius:6px}
.igcard::after{content:"";position:absolute;top:16px;left:16px;width:6px;height:6px;border:2.5px solid #fff;border-radius:50%}
.igcard:hover{transform:translateY(-2px)}
.igcard b{font-size:13px}
.igcard small{font-family:var(--mono);font-size:10px;opacity:.9}
.ctas{display:grid;gap:8px;margin-top:14px}
.cta{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:16px;background:var(--ink);color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(35,26,77,.22);transition:background .2s,transform .2s}
.cta:hover{background:var(--bubble);transform:translateY(-1px)}
.cta-t{display:grid;min-width:0}
.cta-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.cta-v{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:16px}

/* ---------- bottom ---------- */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;
  padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 24px rgba(60,40,150,.16);transition:opacity .4s}
.hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bubble);margin-right:8px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.proto{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75;max-width:22ch}
body.panel-open .hint{opacity:0;pointer-events:none}

/* ---------- object labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid var(--glass-line);background:rgba(255,255,255,.8);
  padding:6px 11px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 4px 16px rgba(60,40,150,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,color .2s,opacity .3s;will-change:transform}
.tag:hover,.tag.hot{background:var(--bubble);color:#fff;border-color:var(--bubble)}
.tag.dim{opacity:.35}

/* ---------- window panel ---------- */
.win{position:fixed;z-index:6;display:flex;flex-direction:column;
  top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:min(470px,calc(100vw - 32px));border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 30px 80px rgba(45,25,120,.35),inset 0 1px 0 #fff;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.win.open{transform:none}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.9);
  background:linear-gradient(100deg,#e6e1ff,#ffe0f1 45%,#ddf8ff 80%,#f1ffd9)}
.titlebar .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bubble) 55%,#b02a7a);flex:none}
.titlebar .fname{font-family:var(--mono);font-size:12px;letter-spacing:.05em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{border:1px solid rgba(35,26,77,.15);background:#fff;border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px}
.xbtn:hover{background:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:24px 24px 8px;overscroll-behavior:contain}
.kicker{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bubble)}
.pbody h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,32px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.intro{margin:12px 0 4px;font-size:16px;line-height:1.5;color:var(--ink);max-width:60ch}
.item{padding:22px 0;border-top:1px solid rgba(35,26,77,.12)}
.item:first-of-type{margin-top:18px}
.item h3{margin:0;font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:-.01em}
.meta{margin:4px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft)}
.item p.d{margin:10px 0 0;font-size:15px;line-height:1.55}
.item p.d + p.d{margin-top:8px}
.intro + .intro{margin-top:10px}
.pbody strong{font-weight:700;color:var(--ink);background:linear-gradient(transparent 62%,rgba(198,255,107,.75) 62%);padding:0 1px}
.item ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.item li{font-size:14.5px;line-height:1.45;padding-left:18px;position:relative}
.item li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--bubble),#8f7bff)}
.media{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;max-width:100%;
  background:linear-gradient(140deg,#ffd3ee,#d9d0ff 45%,#c9f6ff 75%,#eaffc9);border:1px solid #fff;display:flex;align-items:flex-end;padding:8px}
.tile.video{grid-column:span 3;aspect-ratio:16/9;background:linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)}
.tile span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 8px}
.tile.img{padding:0;cursor:zoom-in}
.tile.img img{width:100%;height:100%;object-fit:cover;display:block}
.tile.yt{aspect-ratio:16/9;cursor:pointer;background-size:cover;background-position:center;text-decoration:none;color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid rgba(35,26,77,.15);color:var(--ink);text-decoration:none}
.chip.ig{background:linear-gradient(135deg,#ffe0f1,#e6e1ff)}
.chip:hover{background:var(--ink);color:#fff}
.lb{position:fixed;inset:0;z-index:9;background:rgba(20,12,50,.85);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb{flex-direction:column;gap:14px}
.lb-stage{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:calc(100% - 50px);min-height:0}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb iframe{border:0;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:100%}
.lb iframe.yt{width:min(960px,92vw);aspect-ratio:16/9;background:#000}
.lb iframe.ig{width:min(420px,92vw);height:min(760px,78vh)}
.lb-out{font-family:var(--mono);font-size:12px;color:#fff;text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5)}
.lb-out:hover{background:#fff;color:var(--ink)}
button.chip{cursor:pointer;font-family:var(--mono)}
.lb .xbtn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.tile.video::after,.tile.yt::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-35%,-50%);border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(198,255,107,.55);border:1px solid rgba(35,26,77,.08)}
.hero-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 62%;border-radius:16px;margin:0 0 20px;max-width:100%}
.contact{margin:18px 0 8px;padding:16px;border-radius:16px;background:var(--ink);color:#fff}
.contact p{margin:0}
.contact .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.contact .v{margin-top:6px;font-size:16px;font-weight:600;user-select:all;word-break:break-all}
.pnav{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5)}
.pnav button{border:1px solid rgba(35,26,77,.14);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnav button:hover{background:var(--bubble);color:#fff;border-color:var(--bubble)}

/* ---------- list view ---------- */
.list{position:fixed;inset:0;z-index:7;overflow-y:auto;background:rgba(236,226,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.list-inner{max-width:1080px;margin:0 auto}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.list-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{text-align:left;border:1px solid var(--glass-line);background:rgba(255,255,255,.75);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;
  box-shadow:0 8px 24px rgba(60,40,150,.1);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(60,40,150,.2)}
.card .kicker{margin:0}
.card h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft)}

@media (max-width:700px){
  .pill button{padding:7px 8px}
  .solo .lbl{display:none}
  .solo .ico{display:inline}
  .solo{padding:8px 12px!important}
  .top{padding-right:max(12px,env(safe-area-inset-right,0px))}
  .badge{left:max(12px,env(safe-area-inset-left,0px))}
  .win{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
    width:auto;height:70%;transform:translateY(calc(100% + 30px))}
  .win.open{transform:none}
  .hint{font-size:12.5px}
  .proto{display:none}
  .tag{font-size:10px;padding:5px 9px}
  .pbody{padding:20px 18px 8px}
}
@media (prefers-reduced-motion:reduce){
  .badge .card-id{animation:none}
  .win,.tag,.card{transition:none}
  .hint i{animation:none}
}
</style>

let lang = (()=>{ try{ const s=localStorage.getItem("ana-lang"); if(s && UI[s]) return s; }catch(e){}
  const n=(navigator.language||"es").slice(0,2); return UI[n]?n:"es"; })();
let current = -1;
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const paras = (t,cls)=>String(t).split(/\n\n/).map(p=>`<p class="${cls}">${fmt(p).replace(/\n/g,"<br>")}</p>`).join("");
const plain = t=>String(t).replace(/\*\*/g,"").replace(/\n+/g," ");

function renderUI(){
  const u=UI[lang]; document.documentElement.lang=lang;
  $("#idRole").textContent=u.role; $("#idPlace").textContent=u.place; $("#mailBtn").textContent=u.mail; $("#copyMail").title=u.copied; $("#hint span").textContent=u.hint;
  $("#listLbl").textContent=u.list; $("#listBtn").setAttribute("aria-label",u.list); $("#fieldBtn").textContent=u.field; $("#listTitle").textContent=u.listTitle; $("#closeBtn").textContent=u.close+" ×";
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  labels.forEach((el,i)=>{ el.textContent=C[lang][SECTIONS[i].id].t; });
  $("#grid").innerHTML=SECTIONS.map((s,i)=>{const c=C[lang][s.id];return `<button class="card" data-i="${i}"><p class="kicker">${esc(c.k)}</p><h3>${esc(c.t)}</h3><p>${esc(plain(c.i))}</p></button>`}).join("");
  if(current>=0) renderPanel(current);
}
function renderPanel(i){
  const s=SECTIONS[i], c=C[lang][s.id], u=UI[lang];
  $("#fname").textContent=s.id+".exe";
  let h=(s.id==="sobre"?`<img class="hero-photo" src="media/fbal25-playa.jpg" alt="Ana Georgina Velasco">`:"")+`<p class="kicker">${esc(c.k)}</p><h2 id="pTitle">${esc(c.t)}</h2>${paras(c.i,"intro")}`;
  c.items.forEach((it,j)=>{
    const media=(s.media[j]||[]);
    h+=`<article class="item"><h3>${esc(it.t)}</h3>${it.m?`<p class="meta">${esc(it.m)}</p>`:""}${paras(it.d,"d")}`;
    if(it.b) h+=`<ul>${it.b.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
    const isPost=x=>/instagram\.com\/(p|reel)\//.test(x||"");
    const imgs=media.filter(m=>m.img), yts=media.filter(m=>m.yt), igs=media.filter(m=>isPost(m.ig)), links=media.filter(m=>m.link||(m.ig&&!isPost(m.ig)));
    const thumb=id=>`background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg),linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)`;
    if(imgs.length) h+=`<div class="media">${imgs.map(m=>`<button class="tile img" data-full="${m.img}"><img src="${m.img}" alt="${esc(it.t)}" loading="lazy"></button>`).join("")}</div>`;
    if(yts.length) h+=`<div class="players">${yts.map(m=>EMBED
      ?`<button class="player" data-yt="${m.yt}" style="${thumb(m.yt)}" aria-label="${u.play}: YouTube"></button>`
      :`<a class="player" href="https://youtu.be/${m.yt}" target="_blank" rel="noopener" style="${thumb(m.yt)}"><span class="pl">${u.watchOn} YouTube ↗</span></a>`).join("")}</div>`;
    if(igs.length) h+= EMBED
      ? `<div class="igrow">${igs.map(m=>`<iframe src="${m.ig.split("?")[0].replace(/\/?$/,"/")}embed/" loading="lazy" title="Instagram" allow="autoplay; encrypted-media" scrolling="no"></iframe>`).join("")}</div>${igs.length>1?`<p class="swipe">${u.swipe}</p>`:""}`
      : `<div class="igcards">${igs.map((m,k)=>`<a class="igcard" href="${m.ig}" target="_blank" rel="noopener"><b>${esc(m.label||(u.post+" "+(k+1)))}</b><small>${u.watchOn} Instagram ↗</small></a>`).join("")}</div>`;
    if(links.length) h+=`<div class="ctas">${links.map(m=>`<a class="cta" href="${m.link||m.ig}" target="_blank" rel="noopener"><span class="cta-t"><span class="cta-k">${m.ig?"Instagram":u.openApp}</span><span class="cta-v">${esc(m.label)}</span></span><span class="arr">↗</span></a>`).join("")}</div>`;
    if(it.tags) h+=`<div class="tags">${it.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
    h+=`</article>`;
  });
  $("#pbody").innerHTML=h;
  const p=(i+SECTIONS.length-1)%SECTIONS.length, n=(i+1)%SECTIONS.length;
  $("#prevBtn").textContent=u.prev+C[lang][SECTIONS[p].id].t; $("#nextBtn").textContent=C[lang][SECTIONS[n].id].t+u.next;
}
function openSection(i){
  current=i; renderPanel(i); $("#pbody").scrollTop=0;
  const w=$("#win"); w.classList.add("open"); w.setAttribute("aria-hidden","false"); document.body.classList.add("panel-open");
  labels.forEach((el,k)=>el.classList.toggle("dim",k!==i));
  if(location.hash!=="#"+SECTIONS[i].id) location.hash=SECTIONS[i].id;
}
function closePanel(){
  current=-1; const w=$("#win"); w.classList.remove("open"); w.setAttribute("aria-hidden","true"); document.body.classList.remove("panel-open");
  labels.forEach(el=>el.classList.remove("dim"));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
}
function fromHash(){ const id=location.hash.slice(1); const i=SECTIONS.findIndex(s=>s.id===id); if(i>=0){ if(i!==current) openSection(i);} else if(current>=0) closePanel(); }

addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("#lb").hidden) closeLB(); else if(!$("#list").hidden) $("#list").hidden=true; else closePanel(); }});

function rbox(w,h,d,r=.08){r=Math.min(r,d/2-.001,w/2-.001,h/2-.001);const W=w-2*r,Hh=h-2*r,c=Math.min(r,W/2,Hh/2)*.9,s=new THREE.Shape(),x=-W/2,y=-Hh/2;
  s.moveTo(x+c,y);s.lineTo(x+W-c,y);s.quadraticCurveTo(x+W,y,x+W,y+c);s.lineTo(x+W,y+Hh-c);s.quadraticCurveTo(x+W,y+Hh,x+W-c,y+Hh);s.lineTo(x+c,y+Hh);s.quadraticCurveTo(x,y+Hh,x,y+Hh-c);s.lineTo(x,y+c);s.quadraticCurveTo(x,y,x+c,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(d-2*r,.001),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:4,curveSegments:8});g.center();return g;}
function star(R=.16,r=.07,d=.04){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,q=i%2?r:R;i?s.lineTo(Math.cos(a)*q,Math.sin(a)*q):s.moveTo(Math.cos(a)*q,Math.sin(a)*q);}
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.015,bevelSize:.015,bevelSegments:2});g.center();return g;}
const add=(g,geo,mat,p=[0,0,0],r=[0,0,0],s)=>{const m=new THREE.Mesh(geo,mat);m.position.set(...p);m.rotation.set(...r);if(s)m.scale.set(...s);g.add(m);return m;};

/* ---------- build objects ---------- */
const pickables=[];
const objs=SECTIONS.map((s,i)=>{
  const root=new THREE.Group(), spin=new THREE.Group(), model=SHAPES[s.shape]();
  spin.add(model); root.add(spin); scene.add(root);
  model.traverse(o=>{ if(o.isMesh){ o.userData.si=i; pickables.push(o);} });
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; scene.add(sh);
  const o={root,spin,shadow:sh,target:new THREE.Vector3(),scale:1,hs:1,phase:i*.9};
  if(s.model && THREE.GLTFLoader){ new THREE.GLTFLoader().load(s.model,gl=>{
      const m=gl.scene, box=new THREE.Box3().setFromObject(m), size=box.getSize(new THREE.Vector3());
      m.scale.setScalar(1.15/Math.max(size.x,size.y,size.z)); box.setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
      spin.remove(model); spin.add(m);
      for(let k=pickables.length-1;k>=0;k--) if(pickables[k].userData.si===i) pickables.splice(k,1);
      m.traverse(x=>{ if(x.isMesh){ x.userData.si=i; pickables.push(x);} });
    },undefined,()=>{}); }
  return o;
});

/* ---------- layout: arc (landscape) or 2 columns (portrait) ---------- */
let portrait=false; const view={pos:new THREE.Vector3(),look:new THREE.Vector3(),fov:40};
function layout(){
  const w=innerWidth,h=innerHeight,asp=w/h; portrait=asp<.9;
  renderer.setSize(w,h,false); camera.aspect=asp;
  if(!portrait){
    objs.forEach((o,i)=>{const t=i/(objs.length-1);const x=(t-.5)*13+1.2, z=(i%2?-1.7:.9)-Math.sin(t*Math.PI)*1.2;o.target.set(x,0,z);o.scale=1;});
    const k=Math.max(1,1.55/asp); view.pos.set(0,3.4,12.2*k); view.look.set(0,.9,-.6); view.fov=40;
  } else {
    objs.forEach((o,i)=>{const col=i%3,row=Math.floor(i/3);o.target.set((col-1)*1.75,0,1.3-row*3.3+(col===1?-.9:0));o.scale=.74;});
    view.pos.set(0,6.6,9.6); view.look.set(0,.2,-3.4); view.fov=asp<.6?62:54;
  }
  objs.forEach(o=>o.target.y=H(o.target.x,o.target.z)+1.05);
  camera.updateProjectionMatrix();
}
addEventListener("resize",layout); layout();
objs.forEach(o=>o.root.position.copy(o.target));
const camPos=view.pos.clone(), camLook=view.look.clone(); camera.position.copy(camPos);

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null, parX=0, parY=0;
const canvasEl=$("#scene");
function pick(e){ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);const hit=ray.intersectObjects(pickables,false)[0];return hit?hit.object.userData.si:-1;}
canvasEl.addEventListener("pointermove",e=>{parX=e.clientX/innerWidth-.5;parY=e.clientY/innerHeight-.5;if(e.pointerType==="mouse"){hover=pick(e);canvasEl.style.cursor=hover>=0?"pointer":"default";}});
canvasEl.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY};});
canvasEl.addEventListener("pointerup",e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>8)return;
  const i=pick(e); if(i>=0) openSection(i); else if(current>=0) closePanel();});
canvasEl.addEventListener("pointerleave",()=>{hover=-1;});

/* ---------- loop ---------- */
const clock=new THREE.Clock(), v=new THREE.Vector3(), wantPos=new THREE.Vector3(), wantLook=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(camera.fov!==view.fov){camera.fov+= (view.fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();}
  objs.forEach((o,i)=>{
    const bob=reduce?0:Math.sin(t*1.3+o.phase)*.12;
    o.root.position.x+= (o.target.x-o.root.position.x)*Math.min(1,dt*3);
    o.root.position.z+= (o.target.z-o.root.position.z)*Math.min(1,dt*3);
    o.root.position.y+= (o.target.y+bob-o.root.position.y)*Math.min(1,dt*6);
    const want=o.scale*((hover===i||current===i)?1.16:1); o.hs+=(want-o.hs)*Math.min(1,dt*8); o.root.scale.setScalar(o.hs);
    if(!reduce) o.spin.rotation.y += dt*(current===i?.25:(hover===i?1.4:.45));
    o.spin.rotation.z = reduce?0:Math.sin(t*.9+o.phase)*.06;
    const gy=H(o.root.position.x,o.root.position.z)+.02; o.shadow.position.set(o.root.position.x,gy,o.root.position.z);
    const sc=o.hs*(1.05-bob*1.2); o.shadow.scale.set(sc,sc,1);
    /* label */
    v.copy(o.root.position); v.y+= .95*o.hs; v.project(camera);
    const el=labels[i]; if(v.z>1){el.style.visibility="hidden";} else {el.style.visibility="visible";
      el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;}
    el.classList.toggle("hot",hover===i||current===i);
  });
  /* camera: overview or focus on the open object */
  if(current>=0){const p=objs[current].root.position;
    if(!portrait){wantPos.set(p.x*.85,p.y+1.1,p.z+4.6);wantLook.set(p.x+1.35,p.y-.05,p.z);} else {wantPos.set(p.x*.5,p.y+2.2,p.z+4.4);wantLook.set(p.x*.6,p.y-1.15,p.z);}
  } else {wantPos.copy(view.pos);wantLook.copy(view.look); if(!reduce){wantPos.x+=parX*1.4;wantPos.y-=parY*.6;}}
  const k=reduce?1:Math.min(1,dt*2.4); camPos.lerp(wantPos,k); camLook.lerp(wantLook,k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if(!reduce){ sparkles.material.opacity=.65+.3*Math.sin(t*2.1); sparkles.rotation.y=Math.sin(t*.05)*.1;
    clouds.forEach((c,j)=>{c.position.x+=dt*(.35+j*.04); if(c.position.x>60) c.position.x=-60;}); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
renderUI(); fromHash(); frame();
}

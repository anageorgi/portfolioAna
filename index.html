<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ana Georgina Velasco</title>
<meta name="description" content="Portfolio de Ana Georgina Velasco: comunicación cultural, festivales, medios, mediación y apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a loading screen, then a little house-and-garden lot floating in the sky (WebGL) with objects you can throw; a life-sim profile card and bright windows per object. Single committed light look. */
:root{
  --void:#bfe6ff;
  --paper:#ffffff;
  --ink:#173a5e;
  --ink-soft:#5a7896;
  --glass:rgba(255,255,255,.96);
  --glass-line:#ffffff;
  --bubble:#1f8ef1;
  --lime:#3fcf6b;
  --display:"Fredoka","Baloo 2",system-ui,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,#7cc4ff,#d9f0ff);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bubble);outline-offset:3px}

/* ---------- top chrome ---------- */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{min-width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:0 6px 24px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill button:hover:not([aria-pressed="true"]){background:rgba(255,95,180,.16)}
.solo{padding:11px 16px}

/* ---------- media inside windows ---------- */
.players{display:grid;gap:10px;margin-top:14px}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:0;padding:0;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.player::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(31,142,241,.92);box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
.player::after{content:"";position:absolute;left:50%;top:50%;margin:-12px 0 0 -6px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.player:hover::before{transform:scale(1.1)}
.player .pl{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:4px 10px}
.player.on::before,.player.on::after{display:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.igrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px;padding-bottom:8px;overscroll-behavior-x:contain}
.igrow iframe{flex:none;width:326px;max-width:88%;height:600px;border:0;border-radius:14px;background:#fff;scroll-snap-align:start;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.swipe{margin:8px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.igcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.igcard{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,#49b3ff,#2a7fe0 45%,#3fcf6b);box-shadow:0 6px 16px rgba(0,0,0,.15);transition:transform .2s}
.igcard::before{content:"";position:absolute;top:10px;left:10px;width:18px;height:18px;border:2.5px solid #fff;border-radius:6px}
.igcard::after{content:"";position:absolute;top:16px;left:16px;width:6px;height:6px;border:2.5px solid #fff;border-radius:50%}
.igcard:hover{transform:translateY(-2px)}
.igcard b{font-size:13px}
.igcard small{font-family:var(--mono);font-size:10px;opacity:.9}
.ctas{display:grid;gap:8px;margin-top:14px}
.cta{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:16px;background:var(--ink);color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(29,18,22,.22);transition:background .2s,transform .2s}
.cta:hover{background:var(--bubble);transform:translateY(-1px)}
.cta-t{display:grid;min-width:0}
.cta-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.cta-v{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:16px}

/* ---------- life-sim profile card ---------- */
.sim{position:fixed;z-index:6;top:calc(34px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:min(310px,calc(100vw - 28px));
  background:var(--glass);border-radius:22px;box-shadow:0 14px 40px rgba(20,60,110,.25),inset 0 0 0 2px #fff;overflow:visible}
.sim-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:22px 22px 0 0;background:#fff;color:var(--ink);text-align:left}
.sim.closed .sim-head{border-radius:22px}
.sim-av{position:relative;flex:none;width:60px;height:60px;border-radius:50%;padding:3px;background:linear-gradient(180deg,#8be38f,#2fb85a);display:block}
.sim-av img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff}
.flor{position:absolute;left:50%;top:-30px;width:30px;height:30px;margin-left:-15px;filter:drop-shadow(0 3px 4px rgba(150,60,0,.35));animation:flor 4s ease-in-out infinite}
@keyframes flor{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.sim-id{display:grid;gap:4px;min-width:0;flex:1}
.sim-name{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.1}
.moodbar{display:block;border-radius:999px;padding:3px 10px;background:linear-gradient(180deg,#8be38f,#3fbf5c);color:#fff;font-size:12.5px;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.moodbar b{font-weight:600}
.sim-doing{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-caret{flex:none;transition:transform .2s;color:var(--ink-soft)}
.sim.closed{width:auto}
.sim.closed .sim-caret{transform:rotate(-90deg)}
.sim.closed .sim-body{display:none}
.sim-body{padding:4px 14px 14px;display:grid;gap:8px;max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain;border-radius:0 0 22px 22px}
.thoughts{display:flex;gap:8px;padding:2px 0 4px}
.thoughts span{display:grid;place-items:center;width:40px;height:34px;font-size:18px;background:#fff;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;box-shadow:0 3px 10px rgba(20,60,110,.15),inset 0 0 0 1.5px #e3eef9;animation:bub 3.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bub{50%{transform:translateY(-3px)}}
.acts-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts-list .act{font-size:12.5px;padding:6px 8px 6px 5px;gap:6px;line-height:1.2}
.acts-list .act .ic{width:24px;height:24px;font-size:13px}
.act{display:flex;align-items:center;gap:9px;width:100%;padding:7px 12px 7px 7px;border:0;border-radius:999px;background:linear-gradient(180deg,#fff,#eef4fa);box-shadow:0 2px 0 #d4e2f0,0 4px 10px rgba(20,60,110,.1);font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
.act .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px #dbe8f4;font-size:15px;flex:none}
.act:hover{background:linear-gradient(180deg,#eaf6ff,#d7ecff)}
.sim-k{margin:6px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.sim-asp{margin:0;padding:9px 11px;border-radius:12px;background:#eef7ff;display:grid;gap:2px;font-size:13.5px}
.sim-asp span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bubble)}
.sim-traits{display:flex;flex-wrap:wrap;gap:5px}
.sim-traits span{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:#fff;border:1.5px solid #d6e9fb}
.sim-skills{display:grid;gap:7px}
.skill{display:grid;gap:3px;font-size:12.5px;font-weight:600}
.sbar{height:9px;border-radius:999px;background:#dbe8f4;overflow:hidden;box-shadow:inset 0 1px 2px rgba(20,60,110,.12)}
.sbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#8be38f,#2fb85a)}
.sim-langs{margin:0;font-size:13px;font-weight:600}
.id-links{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.id-links a{display:flex;align-items:center;justify-content:center;padding:9px 8px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid #d6e9fb}
.id-links a.mail{grid-column:1/-1;background:linear-gradient(180deg,#5fe08a,#2fb85a);color:#fff;border-color:transparent;box-shadow:0 3px 0 #1f8f44}
.id-links a:hover{background:var(--bubble);border-color:var(--bubble);color:#fff}
.copymail{border:0;background:none;padding:0;font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center;cursor:copy;word-break:break-all}
.copymail:hover{color:var(--bubble)}

/* ---------- action bubbles in the room ---------- */
.acts{position:fixed;z-index:12;display:grid;gap:6px;width:max-content;max-width:min(280px,calc(100vw - 24px))}
.acts-t{margin:0 0 2px;justify-self:start;padding:4px 12px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:13px}
.acts .act{animation:pop .25s backwards;animation-delay:calc(var(--k) * 45ms)}
@keyframes pop{from{opacity:0;transform:translateX(-8px) scale(.9)}}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));margin:0;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(20,60,110,.3);max-width:calc(100vw - 32px);text-align:center}
.note-view{margin:0;display:grid;gap:10px;justify-items:center}
.note-view img{background:#fffdf6;border-radius:12px;max-width:min(720px,90vw);width:100%;image-rendering:auto}
.note-view figcaption{color:#fff;font-weight:600}

/* ---------- recommendations window ---------- */
.recsw{display:flex;flex-direction:column;overflow-x:hidden}
.recsw>*{min-width:0;max-width:100%;box-sizing:border-box}
.rform input{width:100%;box-sizing:border-box}
.rlist{min-width:0}
.rlist li{min-width:0}
.rlink{margin:12px 12px 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:999px;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(180deg,#30c067,#1f9e50);box-shadow:0 4px 0 #157a3b}
.rlink:hover{filter:brightness(1.07)}
.rmine{display:flex;gap:8px;align-items:center;margin:12px 12px 0;padding:9px 12px;border-radius:12px;background:#fff;border:1.5px dashed #c9bdf2;font-size:13px;font-weight:600;color:var(--ink-soft)}
.rlist{list-style:none;margin:10px 0 0;padding:0 12px;display:grid;gap:6px;max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
.rlist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;box-shadow:0 1px 0 #c9bdf2}
.rlist .rtxt{flex:1;min-width:0;overflow-wrap:anywhere}
.rlist .rby{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.rlist .rempty{justify-content:center;color:var(--ink-soft);font-weight:600;box-shadow:none;background:none}
.rform{display:grid;gap:8px;padding:12px}
.rform input{padding:10px 14px;border-radius:999px;border:2px solid #c9bdf2;font:inherit;font-size:14px;background:#fff;color:var(--ink);min-width:0}
.rrow{display:flex;gap:8px}
.rrow input{flex:1}

/* ---------- drawing window ---------- */
.paint{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(23,58,94,.35);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pwin{width:min(470px,100%);max-height:100%;overflow:auto;background:#efe9ff;border-radius:16px;border:3px solid #fff;box-shadow:0 24px 60px rgba(20,40,90,.35),inset 0 0 0 1px #c9bdf2}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#8c6cf0,#ff8fc8);color:#fff;font-family:var(--mono);font-size:12.5px;border-radius:12px 12px 0 0}
.pbar span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #ffd84d}
.px{border:2px solid #fff;background:rgba(255,255,255,.2);color:#fff;width:26px;height:24px;border-radius:7px;font-size:15px;line-height:1;padding:0}
.pmain{display:flex;gap:8px;padding:10px}
.ptools{display:grid;grid-template-columns:1fr;gap:5px;align-content:start}
.ptools button{width:38px;height:36px;border-radius:9px;border:2px solid #fff;background:#f7f4ff;box-shadow:0 2px 0 #c9bdf2;font-size:17px;padding:0}
.ptools button[aria-pressed="true"]{background:#d9ccff;box-shadow:inset 0 2px 0 #b5a4ee}
#pcv{flex:1;min-width:0;width:100%;aspect-ratio:4/3;height:auto;background:#fffdf6;border-radius:8px;border:2px solid #c9bdf2;touch-action:none;cursor:crosshair}
.pbottom{display:flex;gap:8px;align-items:center;padding:0 10px}
.pcur{flex:none;width:34px;height:34px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 1px #c9bdf2}
.ppal{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;flex:1}
.ppal button,.pcustom{aspect-ratio:1;border:1.5px solid #fff;border-radius:5px;padding:0;box-shadow:0 0 0 1px #c9bdf2;min-width:0}
.pcustom{display:block;position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer}
.pcustom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px}
.psize{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.psize input{width:110px}
#pName{flex:1;min-width:150px;padding:8px 12px;border-radius:999px;border:2px solid #c9bdf2;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.pactions{display:flex;justify-content:flex-end;gap:8px;padding:0 10px 12px}
.pbtn{border:0;border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:600;font-size:15px;background:linear-gradient(180deg,#5fe08a,#2fb85a);color:#fff;box-shadow:0 4px 0 #1f8f44}
.pbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #c9bdf2}
.pbtn:disabled{opacity:.6}

/* ---------- loading screen ---------- */
.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(60% 40% at 20% 20%,rgba(255,255,255,.7),transparent 70%),radial-gradient(50% 35% at 85% 70%,rgba(255,255,255,.55),transparent 70%),linear-gradient(180deg,#4fa8f0,#a6d8ff 60%,#fff3dc);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .6s,visibility .6s}
.loader.out{opacity:0;visibility:hidden}
.ld-c{display:grid;justify-items:center;gap:16px;text-align:center;width:min(640px,100%)}
.ld-bar{max-width:420px}
.ld-k{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#fff}
.ld-name{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(42px,8vw,76px);line-height:.95;color:#fff;text-shadow:0 4px 0 #2a7fe0,0 12px 30px rgba(20,60,110,.3);text-wrap:balance}
.ld-bar{width:100%;height:18px;border-radius:999px;background:rgba(255,255,255,.55);border:2px solid #fff;box-shadow:inset 0 2px 4px rgba(20,60,110,.18);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#3fcf6b,#9cf06a);transition:width .25s}
.ld-msg{margin:0;min-height:1.5em;font-weight:600;color:var(--ink)}
.ld-btn{padding:14px 38px;border-radius:999px;border:0;background:linear-gradient(180deg,#5fe08a,#2fb85a);color:#fff;font-family:var(--display);font-weight:600;font-size:21px;box-shadow:0 6px 0 #1f8f44,0 14px 26px rgba(20,60,110,.25)}
.ld-btn:hover{filter:brightness(1.06)}
.ld-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #1f8f44}

/* ---------- handheld console (Snake) ---------- */
.console{margin:18px 0 6px;padding:16px 16px 14px;border-radius:22px 22px 44px 22px;background:linear-gradient(180deg,#ece8de,#d8d1c3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 8px 20px rgba(20,60,110,.15);display:grid;gap:10px;justify-items:center}
.cs-screen{position:relative;width:100%;max-width:300px;padding:10px;border-radius:10px 10px 22px 10px;background:#4b4f5c}
.cs-screen canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:4px;background:#a7c957;touch-action:none}
.cs-over{position:absolute;inset:10px 10px 10px 10px;display:grid;place-content:center;justify-items:center;gap:10px;background:rgba(167,201,87,.9);border-radius:4px;color:#283618;font-family:var(--mono);text-align:center}
.cs-over b{font-size:18px;letter-spacing:.14em}
.cs-start{border:0;border-radius:999px;padding:9px 20px;background:#283618;color:#e9f5c9;font-family:var(--mono);font-size:13px}
.cs-row{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:#4b4f5c}
.cs-pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,40px);gap:4px}
.cs-pad button{border:0;border-radius:10px;background:#3a3d48;color:#e6e6e6;font-size:14px;box-shadow:0 3px 0 #22242b}
.cs-pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #22242b}
.cs-pad [data-d="up"]{grid-column:2;grid-row:1}.cs-pad [data-d="left"]{grid-column:1;grid-row:2}.cs-pad [data-d="down"]{grid-column:2;grid-row:2}.cs-pad [data-d="right"]{grid-column:3;grid-row:2}
.cs-tip{margin:0;font-size:12px;color:#5a5f6c;text-align:center;max-width:32ch}
@media (max-width:700px){
  .sim{top:calc(32px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px))}
  .sim.closed .sim-head{padding:7px 12px 7px 7px}
  .sim.closed .sim-av{width:42px;height:42px}
  .sim.closed .sim-name{font-size:14px;max-width:110px}
}
@media (prefers-reduced-motion:reduce){ .ld-bar i{transition:none} .loader{transition:none} .flor,.thoughts span,.acts .act{animation:none} }

/* ---------- bottom ---------- */
.hint{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;
  padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.16);transition:opacity .4s}
.hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bubble);margin-right:8px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}

  {t:"Double exposure",m:"Photo exhibition · Toulouse",d:"A series of superimposed, double-exposure photographs where heritage meets modernity in the **heart of Toulouse**.\n\nSculptures on old buildings converse with contemporary shop windows and the silhouettes of passers-by: the timelessness of stone against the fleeting everyday life of the city.\n\nThe compositions question the links between past and present, stillness and movement, offering a fragmented, poetic view of human paths through the city."},

 sobre:{k:"La tasse",t:"À propos",i:"**Créatrice de contenu et spécialiste de la communication digitale**, formée à la communication culturelle, au storytelling et à la production audiovisuelle.\n\nJ'aide les festivals, les institutions culturelles et les projets créatifs à **gagner en visibilité et à toucher leurs publics**. J'ai travaillé pour des festivals, des établissements d'enseignement, des projets musicaux et des structures culturelles au **Mexique et en France**.",items:[

  {t:"Double exposition",m:"Exposition photo · Toulouse",d:"Cette série de photographies superposées en double exposition propose une rencontre entre le patrimoine et la modernité au **cœur de Toulouse**.\n\nLes sculptures des bâtiments anciens dialoguent avec les vitrines contemporaines et les silhouettes des passant·es, révélant un croisement entre l'intemporalité de la pierre et l'éphémère du quotidien urbain.\n\nCes compositions questionnent les liens entre passé et présent, immobilité et mouvement, pour offrir une vision fragmentée et poétique des trajectoires humaines dans la ville."},
  {t:"La même fenêtre",m:"Exposition photo · Pontevedra, Espagne",d:"On ne se baigne jamais deux fois dans le même fleuve, disait Héraclite.\n\nCette série part d'**une seule fenêtre**, photographiée jour après jour : le cadre ne change pas, mais la lumière et les couleurs ne se répètent jamais. Chaque image rappelle qu'aucun jour ne ressemble au précédent."},

/* =========================================================
   3) LANGUAGE + UI
   ========================================================= */
let lang = (()=>{ try{ const s=localStorage.getItem("ana-lang"); if(s && UI[s]) return s; }catch(e){}
  const n=(navigator.language||"es").slice(0,2); return UI[n]?n:"es"; })();
let current = -1;
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const paras = (t,cls)=>String(t).split(/\n\n/).map(p=>`<p class="${cls}">${fmt(p).replace(/\n/g,"<br>")}</p>`).join("");
const plain = t=>String(t).replace(/\*\*/g,"").replace(/\n+/g," ");

function renderUI(){
  const u=UI[lang]; document.documentElement.lang=lang;
  renderLoader(u); renderSim(u); $("#hint span").textContent=u.hint;
  $("#listLbl").textContent=u.list; syncDayBtn(); syncFloorBtn(); if(window.__boseLabel) window.__boseLabel(); $("#listBtn").setAttribute("aria-label",u.list); $("#fieldBtn").textContent=u.field; $("#listTitle").textContent=u.listTitle; $("#closeBtn").textContent=u.close+" ×";
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  labels.forEach((el,i)=>{ el.textContent=C[lang][SECTIONS[i].id].t; });
  $("#grid").innerHTML=SECTIONS.map((s,i)=>{const c=C[lang][s.id];return `<button class="card" data-i="${i}"><p class="kicker">${esc(c.k)}</p><h3>${esc(c.t)}</h3><p>${esc(plain(c.i))}</p></button>`}).join("");
  if(current>=0) renderPanel(current);
}
function renderPanel(i){
  const s=SECTIONS[i], c=C[lang][s.id], u=UI[lang];
  $("#fname").textContent=s.id+".exe";
  let h=(s.id==="sobre"?`<img class="hero-photo" src="media/fbal25-playa.jpg" alt="Ana Georgina Velasco">`:"")+`<p class="kicker">${esc(c.k)}</p><h2 id="pTitle">${esc(c.t)}</h2>${paras(c.i,"intro")}`;
  if(s.id==="apps") h+=snakeHTML(u);
  c.items.forEach((it,j)=>{
    const media=(s.media[j]||[]);
    h+=`<article class="item"><h3>${esc(it.t)}</h3>${it.m?`<p class="meta">${esc(it.m)}</p>`:""}${paras(it.d,"d")}`;
    if(it.b) h+=`<ul>${it.b.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
    const isPost=x=>/instagram\.com\/(p|reel)\//.test(x||"");
    const imgs=media.filter(m=>m.img), yts=media.filter(m=>m.yt), igs=media.filter(m=>isPost(m.ig)), links=media.filter(m=>m.link||(m.ig&&!isPost(m.ig)));
    const thumb=id=>`background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg),linear-gradient(140deg,#5c4fd1,#b07cff 50%,#ff8fcf)`;
    if(imgs.length) h+=`<div class="media">${imgs.map(m=>`<button class="tile img" data-full="${m.img}"><img src="${m.img}" alt="${esc(it.t)}" loading="lazy"></button>`).join("")}</div>`;
    if(yts.length) h+=`<div class="players">${yts.map(m=>EMBED
      ?`<button class="player" data-yt="${m.yt}" style="${thumb(m.yt)}" aria-label="${u.play}: YouTube"></button>`
      :`<a class="player" href="https://youtu.be/${m.yt}" target="_blank" rel="noopener" style="${thumb(m.yt)}"><span class="pl">${u.watchOn} YouTube ↗</span></a>`).join("")}</div>`;
    if(igs.length) h+= EMBED
      ? `<div class="igrow">${igs.map(m=>`<iframe src="${m.ig.split("?")[0].replace(/\/?$/,"/")}embed/" loading="lazy" title="Instagram" allow="autoplay; encrypted-media" scrolling="no"></iframe>`).join("")}</div>${igs.length>1?`<p class="swipe">${u.swipe}</p>`:""}`
      : `<div class="igcards">${igs.map((m,k)=>`<a class="igcard" href="${m.ig}" target="_blank" rel="noopener"><b>${esc(m.label||(u.post+" "+(k+1)))}</b><small>${u.watchOn} Instagram ↗</small></a>`).join("")}</div>`;
    if(links.length) h+=`<div class="ctas">${links.map(m=>`<a class="cta" href="${m.link||m.ig}" target="_blank" rel="noopener"><span class="cta-t"><span class="cta-k">${m.ig?"Instagram":u.openApp}</span><span class="cta-v">${esc(m.label)}</span></span><span class="arr">↗</span></a>`).join("")}</div>`;
    if(it.tags) h+=`<div class="tags">${it.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
    h+=`</article>`;
  });
  $("#pbody").innerHTML=h;
  const p=(i+SECTIONS.length-1)%SECTIONS.length, n=(i+1)%SECTIONS.length;
  $("#prevBtn").textContent=u.prev+C[lang][SECTIONS[p].id].t; $("#nextBtn").textContent=C[lang][SECTIONS[n].id].t+u.next;
}
function openSection(i){
  current=i; renderPanel(i); $("#pbody").scrollTop=0;
  const w=$("#win"); w.classList.add("open"); w.setAttribute("aria-hidden","false"); document.body.classList.add("panel-open");
  labels.forEach((el,k)=>el.classList.toggle("dim",k!==i));
  if(location.hash!=="#"+SECTIONS[i].id) location.hash=SECTIONS[i].id;
}
function closePanel(){
  current=-1; const w=$("#win"); w.classList.remove("open"); w.setAttribute("aria-hidden","true"); document.body.classList.remove("panel-open");
  labels.forEach(el=>el.classList.remove("dim"));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
}

/* ---------- loop ---------- */
const clock=new THREE.Clock(), v=new THREE.Vector3(), dv=new THREE.Vector3(), sph=new THREE.Spherical(), G=-9;

const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));

const cDay=new THREE.Color(), cNight=new THREE.Color();

function placeTag(el,p,lift,show,hot){ v.copy(p); v.y+=lift; v.project(camera); const ok=show&&entered&&v.z<1;
  el.style.visibility=ok?"visible":"hidden";
  if(ok) el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
  el.classList.toggle("hot",!!hot); }
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  nightMix+=(nightTarget-nightMix)*Math.min(1,dt*(reduce?20:1.8));

  lerpCol(scene.fog.color,D.fog,N.fog,m);
  stars.material.opacity=D.stars+(N.stars-D.stars)*m+(reduce?0:.06*Math.sin(t*2.1)*m);
  nebulae.forEach((n,k)=>{ n.material.opacity=(D.neb+(N.neb-D.neb)*m)*(.7+.3*Math.sin(t*.4+k)); });
  glows.forEach((g,k)=>{ g.material.opacity=(D.glow+(N.glow-D.glow)*m)*(.75+.25*Math.sin(t*.6+k*2)); });
  clouds.mat.opacity=D.clouds+(N.clouds-D.clouds)*m;

  hemi.intensity=D.hemi+(N.hemi-D.hemi)*m;
  lerpCol(scanTint,D.tint,N.tint,m); lerpCol(shellTint,"#f3ece0","#857fb0",m); lerpCol(paneCol,"#bfe6ff","#2a1f5c",m);
  if(paneStars) paneStars.opacity=m*(.85+.15*Math.sin(t*1.6));

  /* fly to the place where the open section lives */
  if(entered && current!==lastCur){ lastCur=current;
    if(current>=0){ const o=objs[current], h=o.home; if(o.state!=="home"&&!o.fixed) o.state="return";
      sph.setFromVector3(tmp.copy(camera.position).sub(controls.target));
      const p=new THREE.Vector3().setFromSphericalCoords(portrait?5:3.8,Math.min(1.0,Math.max(.65,sph.phi)),sph.theta).add(h);
      flyTo(p,h.clone(),1.1);
    } else flyTo(view.pos,view.target,1.1); }
  if(fly){ fly.k+=dt/fly.dur; const e=ease(Math.min(1,fly.k)); camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.k>=1) fly=null; }

  offX+=(wantX-offX)*kk; offY+=(wantY-offY)*kk;
  if(Math.abs(offX)>.5||Math.abs(offY)>.5) camera.setViewOffset(innerWidth,innerHeight,offX,offY,innerWidth,innerHeight);
  else if(camera.view&&camera.view.enabled) camera.clearViewOffset();

  /* the small objects: hover over their furniture, follow the hand, fall, come back */
  objs.forEach((o,i)=>{ if(o.fixed) return;
    const P=o.root.position, S=o.spin.rotation;
    if(o.state==="home"){
      const bob=reduce?0:Math.sin(t*1.5+o.phase)*.035, k=Math.min(1,dt*3);
      P.x+=(o.home.x-P.x)*k; P.z+=(o.home.z-P.z)*k; P.y+=(o.home.y+bob-P.y)*Math.min(1,dt*5);
      if(!reduce) S.y+=dt*(current===i?.3:(hover===i?1.6:.5));
      S.x+=(0-S.x)*k; S.z+=(0-S.z)*k;
    } else if(o.state==="held"){
      o.vel.multiplyScalar(Math.pow(.02,dt)); S.y+=dt*2;
    } else if(o.state==="free"){
      o.vel.y+=G*dt; P.addScaledVector(o.vel,dt);
      if(P.y<o.r){ P.y=o.r; if(o.vel.y<0) o.vel.y=-o.vel.y*.45; if(o.vel.y<.5) o.vel.y=0;
        const f=Math.pow(.2,dt); o.vel.x*=f; o.vel.z*=f; o.av.multiplyScalar(Math.pow(.15,dt)); }
      if(P.y>1.95){ P.y=1.95; o.vel.y=-Math.abs(o.vel.y)*.5; }
      [["x",B.xmin,B.xmax],["z",B.zmin,B.zmax]].forEach(([ax,lo,hi])=>{ if(P[ax]<lo+o.r){ P[ax]=lo+o.r; if(o.vel[ax]<0) o.vel[ax]*=-.6; } if(P[ax]>hi-o.r){ P[ax]=hi-o.r; if(o.vel[ax]>0) o.vel[ax]*=-.6; } });
      S.x+=o.av.x*dt; S.y+=o.av.y*dt; S.z+=o.av.z*dt;
      const still=P.y<=o.r+.01 && o.vel.lengthSq()<.03; o.rest=still?o.rest+dt:0;
      if(o.rest>2){ o.state="return"; S.x=wrapA(S.x); S.z=wrapA(S.z); }
    } else if(o.state==="return"){
      const k=Math.min(1,dt*2); P.lerp(o.home,k); S.x+=(0-S.x)*k; S.z+=(0-S.z)*k; S.y+=dt*.5;
      if(P.distanceTo(o.home)<.03) o.state="home";
    }
    const want=MS*((hover===i||current===i)&&o.state==="home"?1.25:1); o.hs+=(want-o.hs)*Math.min(1,dt*8); o.root.scale.setScalar(o.hs);
  });
  for(let a=0;a<objs.length;a++) for(let b=a+1;b<objs.length;b++){
    const A=objs[a],Bo=objs[b]; if(A.fixed||Bo.fixed||(!active(A.state)&&!active(Bo.state))) continue;
    dv.subVectors(Bo.root.position,A.root.position); const d=dv.length(), mm=A.r+Bo.r; if(d>=mm||d<1e-4) continue;
    dv.divideScalar(d); const ov=mm-d, wa=A.state==="held"?0:(Bo.state==="held"?1:.5);
    A.root.position.addScaledVector(dv,-ov*wa); Bo.root.position.addScaledVector(dv,ov*(1-wa));
    [A,Bo].forEach(X=>{ if(X.state==="home"||X.state==="return"){ X.state="free"; X.rest=0; } });
    const rv=(Bo.vel.x-A.vel.x)*dv.x+(Bo.vel.y-A.vel.y)*dv.y+(Bo.vel.z-A.vel.z)*dv.z;
    if(rv<0){ const j=-1.7*rv; if(A.state!=="held") A.vel.addScaledVector(dv,-j*(Bo.state==="held"?1:.5)); if(Bo.state!=="held") Bo.vel.addScaledVector(dv,j*(A.state==="held"?1:.5)); }
  }

  /* labels: one per section, placed where it lives, plus the speaker */
  objs.forEach((o,i)=>{ const spotHot=o.spot>=0&&SPOTS[o.spot].hot;
    placeTag(labels[i],o.fixed?o.home:o.root.position,o.lift,o.fixed||o.state==="home",hover===i||current===i||spotHot); });
  placeTag(boseTag,v.set(...SPOTS[boseK].p).clone(),.45,true,SPOTS[boseK].hot);

  /* spot sparkles */
  SPOTS.forEach((s,k)=>{ const sc=.3*(1+(reduce?0:.16*Math.sin(t*2.6+k*1.7)))*(s.hot?1.5:1); s.marker.scale.set(sc,sc,1);
    s.marker.material.rotation=reduce?0:t*.6+k; });

  if(!tv.video && (Math.floor(t*12)!==tv.f)){ tv.f=Math.floor(t*12); drawNoise(); }
  if(!reduce){ clouds.forEach(c=>{ c.userData.a+=c.userData.sp*dt; c.position.x=Math.cos(c.userData.a)*c.userData.r; c.position.z=Math.sin(c.userData.a)*c.userData.r; });
    stars.rotation.y=t*.004; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- action bubbles ---------- */
const secIdx=id=>SECTIONS.findIndex(s=>s.id===id), go=id=>()=>openSection(secIdx(id));
showObjActs=(i,x,y)=>{ const s=SECTIONS[i], u=UI[lang], c=C[lang][s.id], acts=[[ACT_ICON[s.id]||"👀",u.actOpen+" "+c.t,()=>openSection(i)]];
  if(s.shape==="pencil") acts.push(["✏️",u.actDraw,()=>openPaint()]);
  if(s.id==="apps") acts.push(["🎮",u.actSnake,()=>{ openSection(i); setTimeout(()=>{ const el=document.querySelector(".console"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); },650); }]);
  showActs(x,y,c.t,acts); };
showTvActs=(x,y)=>{ const u=UI[lang]; showActs(x,y,u.tvName,[["🎬",u.actOpen+" "+C[lang].foto.t,go("foto")],["📼",u.actTv,()=>openTv()]]); };
showSpotActs=(k,x,y)=>{ const u=UI[lang], id=SPOTS[k].id;
  if(id==="tote") showActs(x,y,u.spotTote,[["🎪",u.actTote,go("eventos")]]);
  else if(id==="kitchen") showActs(x,y,u.spotKitchen,[["💀",u.actAteliers,go("mediacion")],["🌮",u.actComida,"https://www.instagram.com/comidariquita/"]]);
  else if(id==="kindle") showActs(x,y,u.spotKindle,[["📖",u.actResearch,go("investigacion")],["📚",u.actBooks,()=>openRecs("books")]]);
  else if(id==="bose") showActs(x,y,u.spotBose,[["🎧",u.actPlaylist,"https://open.spotify.com/playlist/5mnycnBH6tDYbcElYltTU2"],["🎵",u.actSongs,()=>openRecs("songs")]]); };
window.__boseLabel=()=>{ boseTag.textContent="🎧 "+UI[lang].boseTag; };
renderUI(); frame();
if(loaderDone){ onEnter(); fromHash(); }
}
</script>
